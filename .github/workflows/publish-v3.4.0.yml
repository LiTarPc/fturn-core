name: Finalize v3.4.0 Prerelease

on:
  push:
    branches: [tcp-upgrade]
    paths:
      - ".github/workflows/publish-v3.4.0.yml"

permissions:
  contents: write

env:
  RELEASE_ID: "390869993"
  RELEASE_TAG: v3.4.0
  RELEASE_SHA: d858b9a3710cca6b93d1ffdffa2996fae9c91d23

jobs:
  finalize:
    name: Finalize existing v3.4.0 draft
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 0

      - name: Verify tag and uploaded assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git fetch --tags origin
          TAG_SHA=$(git rev-list -n1 "$RELEASE_TAG")
          test "$TAG_SHA" = "$RELEASE_SHA"

          ASSETS=$(gh api "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}" --jq '.assets[].name')
          for NAME in \
            checksums.txt \
            client-android-arm64 \
            client-windows-amd64.exe \
            freeturn.aar \
            freeturn-sources.jar \
            server-linux-amd64
          do
            echo "$ASSETS" | grep -Fx "$NAME" >/dev/null
          done

      - name: Publish as prerelease
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api --method PATCH "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}" \
            -F draft=false \
            -F prerelease=true >/dev/null

          test "$(gh api "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}" --jq '.draft')" = "false"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}" --jq '.prerelease')" = "true"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}" --jq '.tag_name')" = "$RELEASE_TAG"
