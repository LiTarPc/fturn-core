name: Build binaries

on:
  push:
    branches:
      - master
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to build (branch, tag, or commit SHA)
        required: true
        default: v3.3.1
        type: string

permissions:
  contents: read

env:
  BUILD_REF: ${{ github.event.inputs.ref || github.sha }}

jobs:
  build:
    name: Build standalone binaries
    runs-on: ubuntu-latest

    steps:
      - name: Checkout requested ref
        uses: actions/checkout@v6.0.2
        with:
          ref: ${{ env.BUILD_REF }}
          fetch-depth: 0

      - name: Set up Go from go.mod
        uses: actions/setup-go@v6.4.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Show build info
        run: |
          echo "Requested ref: ${BUILD_REF}"
          git rev-parse HEAD
          go version
          head -n 5 go.mod

      - name: Build binaries
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist

          VERSION="${BUILD_REF#refs/tags/}"
          VERSION="${VERSION#v}"
          LDFLAGS="-s -w -checklinkname=0 -X main.version=${VERSION}"

          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 \
            go build -trimpath -ldflags "$LDFLAGS" \
            -o dist/client-linux-amd64 ./cmd/client

          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 \
            go build -trimpath -ldflags "$LDFLAGS" \
            -o dist/server-linux-amd64 ./cmd/server

          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 \
            go build -trimpath -ldflags "$LDFLAGS" \
            -o dist/client-windows-amd64.exe ./cmd/client

          sha256sum dist/* > dist/checksums.txt

          ls -lh dist
          cat dist/checksums.txt

      - name: Upload binaries
        uses: actions/upload-artifact@v7.0.1
        with:
          name: fturn-binaries-${{ github.run_number }}
          path: dist/
          if-no-files-found: error
          retention-days: 14

      - name: Build summary
        run: |
          {
            echo '### Binary build complete'
            echo
            echo "Ref: \`${BUILD_REF}\`"
            echo
            echo '- client-linux-amd64'
            echo '- server-linux-amd64'
            echo '- client-windows-amd64.exe'
            echo '- checksums.txt'
          } >> "$GITHUB_STEP_SUMMARY"
