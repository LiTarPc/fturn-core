name: TCP Upgrade Integration

on:
  push:
    branches: [tcp-upgrade]
    paths:
      - "internal/proxy/tcprelay/**"
      - "internal/proxy/tcpserver/**"
      - "internal/transport/**"
      - ".github/workflows/tcp-integration.yml"
      - "go.mod"
      - "go.sum"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tcp-integration-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: "1.26.6"

jobs:
  integration:
    name: TURN/TCP end-to-end recovery
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6.0.2

      - uses: actions/setup-go@v6.4.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Run TCP integration test
        run: go test -tags=integration -v -count=1 -timeout=3m ./internal/proxy/tcprelay
