name: TCP Upgrade Integration

on:
  push:
    branches: [tcp-upgrade]
    paths:
      - "cmd/client/**"
      - "cmd/server/**"
      - "mobile/**"
      - "internal/config/**"
      - "internal/proxy/tcprelay/**"
      - "internal/proxy/tcpserver/**"
      - "internal/transport/**"
      - ".github/workflows/tcp-integration.yml"
      - "Taskfile.yml"
      - "go.mod"
      - "go.sum"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tcp-integration-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: "1.26.6"
  GOMOBILE_VERSION: latest
  TASK_VERSION: 3.52.0

jobs:
  integration:
    name: Build targets + TURN/TCP recovery
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6.0.2

      - uses: actions/setup-go@v6.4.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - uses: arduino/setup-task@v2.0.0
        with:
          version: ${{ env.TASK_VERSION }}
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build production client
        run: go build -o /tmp/fturn-client ./cmd/client

      - name: Build production server
        run: |
          mkdir -p dist
          go build -trimpath -ldflags "-s -w -checklinkname=0" -o dist/fturn-server-linux-amd64 ./cmd/server
          test -s dist/fturn-server-linux-amd64

      - name: Build Windows client amd64
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: "0"
        run: |
          mkdir -p dist
          go build -trimpath -ldflags "-s -w -checklinkname=0" -o dist/fturn-client-windows-amd64.exe ./cmd/client
          test -s dist/fturn-client-windows-amd64.exe

      - name: Set up Android NDK
        run: |
          NDK_DIR=$(ls -d "$ANDROID_SDK_ROOT"/ndk/*/ 2>/dev/null | sort -V | tail -n1)
          test -n "$NDK_DIR"
          echo "ANDROID_NDK_HOME=${NDK_DIR%/}" >> "$GITHUB_ENV"

      - name: Install gomobile
        run: |
          go install golang.org/x/mobile/cmd/gomobile@${{ env.GOMOBILE_VERSION }}
          gomobile init

      - name: Build Android AAR
        run: |
          task build:android
          test -s dist/freeturn.aar

      - name: Run SMUX profile tests
        run: go test -v -count=1 ./internal/config ./internal/transport/kcpmux ./internal/proxy/tcpserver

      - name: Run TCP integration test
        run: go test -tags=integration -v -count=1 -timeout=3m ./internal/proxy/tcprelay

      - name: Upload Linux server
        uses: actions/upload-artifact@v7.0.1
        with:
          name: fturn-server-linux-amd64
          path: dist/fturn-server-linux-amd64
          retention-days: 7

      - name: Upload Windows client
        uses: actions/upload-artifact@v7.0.1
        with:
          name: fturn-client-windows-amd64
          path: dist/fturn-client-windows-amd64.exe
          retention-days: 7

      - name: Upload Android AAR
        uses: actions/upload-artifact@v7.0.1
        with:
          name: freeturn-aar
          path: |
            dist/freeturn.aar
            dist/freeturn-sources.jar
          retention-days: 7
